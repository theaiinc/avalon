[package]
name = "avalon"
version = "0.1.0"
description = "Avalon local LLM dashboard and authenticated gateway"
authors = ["Avalon contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
getrandom = "0.2"
base64 = "0.22"
gethostname = "0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
